<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dungeon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="info">
            <div>Controls: WASD or Arrow Keys to move</div>
            <div>Position: <span id="position">0, 0</span></div>
            <div>Chunk: <span id="chunk">0, 0</span></div>
            <div>Seed: <span id="seed"></span></div>
        </div>
    </div>

    <!-- Mobile Joystick -->
    <div id="joystick" aria-hidden="true">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>
    <script>
        // Show seed in info panel
        let randomSeed = Math.floor(Math.random() * 10000000);
        document.getElementById('seed').textContent = randomSeed;
    </script>
    <!-- Engine systems -->
    <script src="src/engine/input.js"></script>
    <script src="src/engine/camera.js"></script>
    <script src="src/engine/render.js"></script>
    <script src="src/engine/loop.js"></script>
    
    <!-- World systems -->
    <script src="src/world/tileset.js"></script>
    <script src="src/world/generator.js"></script>
    <script src="src/world/chunk.js"></script>
    
    <!-- Entities -->
    <script src="src/entities/player.js"></script>
    
    <!-- Main game -->
    <script src="main.js"></script>
</body>
</html>
