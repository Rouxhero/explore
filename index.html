<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dungeon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="info">
            <div>Controls: WASD or Arrow Keys to move</div>
            <div>Position: <span id="position">0, 0</span></div>
            <div>Chunk: <span id="chunk">0, 0</span></div>
            <div>Seed: <span id="seed">12345</span></div>
        </div>
    </div>
    <!-- Engine systems -->
    <script src="src/engine/input.js"></script>
    <script src="src/engine/camera.js"></script>
    <script src="src/engine/render.js"></script>
    <script src="src/engine/loop.js"></script>
    
    <!-- World systems -->
    <script src="src/world/tileset.js"></script>
    <script src="src/world/generator.js"></script>
    <script src="src/world/chunk.js"></script>
    
    <!-- Entities -->
    <script src="src/entities/player.js"></script>
    
    <!-- Main game -->
    <script src="main.js"></script>
</body>
</html>
